name: DoNotNervous
options:
  bundleIdPrefix: com.serendylin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  DoNotNervous:
    type: application
    platform: iOS
    sources:
      - path: DoNotNervous
        excludes:
          - Resources/Info.plist
          - Resources/README.md
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serendylin.DoNotNervous
        PRODUCT_MODULE_NAME: DoNotNervousIOS
        PRODUCT_NAME: 不要紧张
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 不要紧张
        INFOPLIST_KEY_DNNAPIBaseURL: "$(DNN_API_BASE_URL)"
    scheme:
      testTargets:
        - DoNotNervousTests
  DoNotNervousTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DoNotNervousTests
    dependencies:
      - target: DoNotNervous
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serendylin.DoNotNervousTests
        PRODUCT_NAME: DoNotNervousTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/不要紧张.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/不要紧张"
